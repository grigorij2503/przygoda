<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>TTRPG Gemini Master • Wieloosobowy RPG</title>

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0c10">
  <meta name="background-color" content="#0a0c10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TTRPG Gemini">
  <meta name="application-name" content="TTRPG Gemini Master">
  <meta name="description" content="Wieloosobowy turowy RPG prowadzony przez Gemini AI z deterministycznymi rzutami kością">

  <!-- PWA Icons & Favicon -->
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/icons/icon-512.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: {
              300: '#f6e05e',
              400: '#ecc94b',
              500: '#d4af37',
              600: '#b7950b',
            },
            parchment: '#161922',
            darkslate: '#0a0c10',
          }
        }
      }
    }
  </script>

  <!-- Frontend assets load in dependency order before Alpine initializes. -->
  <link rel="stylesheet" href="/static/css/style.css?v=20">
  <script defer src="/static/js/modules/core.js?v=28"></script>
  <script defer src="/static/js/modules/pwa-notifications.js?v=28"></script>
  <script defer src="/static/js/modules/auth-admin.js?v=28"></script>
  <script defer src="/static/js/modules/session-character.js?v=28"></script>
  <script defer src="/static/js/modules/story-map-proxy.js?v=28"></script>
  <script defer src="/static/js/modules/realtime-chat.js?v=28"></script>
  <script defer src="/static/js/modules/campaign-actions.js?v=28"></script>
  <script defer src="/static/js/modules/equipment-images.js?v=28"></script>
  <script defer src="/static/js/modules/local-components.js?v=28"></script>
  <script defer src="/static/js/app.js?v=28"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
</head>
<body x-data="rpgGame" class="min-h-screen text-gray-200 antialiased selection:bg-amber-600 selection:text-white">
  {% include "partials/system_banners.html" %}
  {% include "partials/auth_gate.html" %}
  {% include "partials/lobby.html" %}
  {% include "partials/character_selection.html" %}
  {% include "partials/game_table.html" %}
  {% include "partials/modals.html" %}
</body>
</html>
