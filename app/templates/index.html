<!DOCTYPE html>
<html lang="pl" class="{{ 'dark' if theme.color_scheme == 'dark' else '' }}" data-theme="{{ theme.id }}" data-typeface="{{ theme.typography_id }}" data-texture="{{ theme.texture_id }}" data-icon-set="{{ theme.icon_set_id }}" data-shape="{{ theme.shape_id }}" data-world-key="{{ world_key }}" style="{{ theme_style }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Przygoda • Wieloosobowy RPG</title>

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="/manifest.json?v=2">
  <meta name="theme-color" content="{{ theme_background }}">
  <meta name="background-color" content="{{ theme_background }}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Przygoda RPG">
  <meta name="application-name" content="Przygoda RPG">
  <meta name="description" content="Wieloosobowy RPG z wersjonowanymi światami, losowymi rzutami d20 i narracją AI">

  <!-- PWA Icons & Favicon -->
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon.png?v=2">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=2">

  <!-- Runs before CSS so the local theme preview does not flash on reload. -->
  <script src="/static/js/theme-bootstrap.js?v=33"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: {
              300: '#f6e05e',
              400: '#ecc94b',
              500: '#d4af37',
              600: '#b7950b',
            },
            parchment: '#161922',
            darkslate: '#0a0c10',
          }
        }
      }
    }
  </script>

  <!-- Frontend assets load in dependency order before Alpine initializes. -->
  <link rel="stylesheet" href="/static/css/style.css?v=33">
  <script defer src="/static/js/modules/core.js?v=41"></script>
  <script defer src="/static/js/modules/pwa-notifications.js?v=32"></script>
  <script defer src="/static/js/modules/auth-admin.js?v=39"></script>
  <script defer src="/static/js/modules/session-character.js?v=39"></script>
  <script defer src="/static/js/modules/story-map-proxy.js?v=42"></script>
  <script defer src="/static/js/modules/realtime-chat.js?v=38"></script>
  <script defer src="/static/js/modules/campaign-actions.js?v=34"></script>
  <script defer src="/static/js/modules/equipment-images.js?v=33"></script>
  <script defer src="/static/js/modules/market.js?v=2"></script>
  <script defer src="/static/js/modules/local-components.js?v=31"></script>
  <script defer src="/static/js/app.js?v=35"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
</head>
<body x-data="rpgGame" class="min-h-screen text-gray-200 antialiased selection:bg-amber-600 selection:text-white">
  {% include "partials/system_banners.html" %}
  {% include "partials/auth_gate.html" %}
  {% include "partials/lobby.html" %}
  {% include "partials/character_selection.html" %}
  {% include "partials/game_table.html" %}
  {% include "partials/modals.html" %}
</body>
</html>
