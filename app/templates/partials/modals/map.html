  <!-- ==================== MODAL: MAPA KAMPANII ==================== -->
  <div x-show="showMapModal" @keydown.escape.window="showMapModal = false" @click.self="showMapModal = false"
       role="dialog" aria-modal="true" aria-labelledby="map-dialog-title"
       class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-2 md:p-5" x-cloak>
    <div class="campaign-map-modal fantasy-card rounded-2xl w-full max-w-7xl border border-cyan-900/70 shadow-2xl flex flex-col" @click.stop>
      <div class="flex flex-wrap items-center justify-between gap-3 p-4 md:px-6 border-b border-slate-800">
        <div>
          <h3 id="map-dialog-title" class="ui-heading text-xl md:text-2xl font-fantasy font-bold text-cyan-200 flex items-center gap-2">
            <span class="ui-theme-icon ui-theme-icon--map" aria-hidden="true">🗺️</span> MAPA WYPRAWY
          </h3>
          <p class="text-[10px] md:text-xs text-gray-400 mt-1">
            Odwiedzone: <b class="text-cyan-300" x-text="campaignMap?.discovered_count || 0"></b>
            / <b class="text-gray-300" x-text="campaignMap?.total_nodes || 0"></b> lokacji
          </p>
        </div>
        <div class="flex items-center gap-1.5" aria-label="Sterowanie mapą">
          <button type="button" @click="adjustMapZoom(-0.25)" class="map-control" aria-label="Pomniejsz mapę">−</button>
          <span class="map-zoom-label" x-text="Math.round(mapZoom * 100) + '%'"></span>
          <button type="button" @click="adjustMapZoom(0.25)" class="map-control" aria-label="Powiększ mapę">＋</button>
          <button type="button" @click="resetMapView()" class="map-control map-control--text">Dopasuj</button>
          <button type="button" @click="showPartyOnMap()" class="map-control map-control--party">● Drużyna</button>
          <button @click="showMapModal = false" class="map-control" aria-label="Zamknij mapę">✕</button>
        </div>
      </div>

      <div x-show="campaignMap" class="campaign-map-viewport">
        <svg class="campaign-map-svg" role="img" aria-label="Schemat odkrytych pomieszczeń i korytarzy. Przeciągnij, aby przesunąć mapę."
             :class="mapDrag ? 'campaign-map-svg--dragging' : ''"
             x-effect="$el.setAttribute('viewBox', mapViewBox)"
             @wheel.prevent="adjustMapZoom($event.deltaY < 0 ? 0.2 : -0.2)"
             @pointerdown="beginMapPan($event)" @pointermove="continueMapPan($event)"
             @pointerup="endMapPan($event)" @pointercancel="endMapPan($event)"
             preserveAspectRatio="xMidYMid meet">
          <defs>
            <pattern id="map-grid" width="16" height="16" patternUnits="userSpaceOnUse">
              <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(71,85,105,0.12)" stroke-width="1"></path>
            </pattern>
            <pattern id="room-dots" width="12" height="12" patternUnits="userSpaceOnUse">
              <circle cx="6" cy="6" r="1" fill="#64748b" opacity="0.32"></circle>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#map-grid)"></rect>

          <g x-ref="campaignMapDrawing"></g>
        </svg>
      </div>

      <div x-show="!campaignMap" class="h-72 flex items-center justify-center text-gray-400 text-sm">
        Mapa kampanii nie jest jeszcze dostępna.
      </div>

      <div x-show="campaignMap" class="p-4 md:px-6 border-t border-slate-800 bg-slate-950/70">
        <div class="grid lg:grid-cols-[minmax(0,1fr)_minmax(18rem,0.65fr)] gap-5">
          <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-2">
              <span class="text-[10px] uppercase tracking-widest text-cyan-500 font-mono"
                    x-text="selectedMapNode?.id === campaignMap?.current_node_id ? 'Bieżąca lokacja' : 'Odwiedzona lokacja'"></span>
              <span x-show="selectedMapNode?.discovered_turn !== null && selectedMapNode?.discovered_turn !== undefined"
                    class="text-[9px] px-2 py-0.5 rounded-full border border-slate-700 text-slate-400 font-mono"
                    x-text="selectedMapNode?.discovered_turn === 0 ? 'początek wyprawy' : `odkryta w turze ${selectedMapNode?.discovered_turn}`"></span>
            </div>
            <h4 class="text-base font-fantasy font-bold text-cyan-200 mt-0.5" x-text="selectedMapNode?.name"></h4>
            <p x-show="selectedMapNode?.system_name"
               class="text-[10px] text-slate-500 mt-0.5"
               x-text="`Nazwa systemowa: ${selectedMapNode?.system_name}`"></p>
            <p class="text-xs text-gray-400 mt-1 leading-relaxed" x-text="selectedMapNode?.description"></p>

            <div x-show="selectedMapNode?.contents?.length" class="mt-3">
              <span class="text-[9px] uppercase tracking-widest text-slate-500 font-mono">Zauważone elementy</span>
              <div class="flex flex-wrap gap-1.5 mt-1.5">
                <template x-for="element in selectedMapNode?.contents || []" :key="element">
                  <span class="text-[10px] px-2 py-1 rounded-md bg-slate-900 border border-slate-700/70 text-slate-300" x-text="element"></span>
                </template>
              </div>
            </div>
          </div>

          <div class="min-w-0">
            <span class="text-[10px] uppercase tracking-widest text-slate-500 font-mono">Przebyta trasa</span>
            <div class="flex flex-wrap gap-1.5 mt-2">
              <template x-for="node in visitedMapNodes" :key="node.id">
                <button type="button" @click="selectMapNode(node.id)"
                        :class="node.id === selectedMapNode?.id ? 'border-cyan-500/70 bg-cyan-950/50 text-cyan-200' : 'border-slate-700 bg-slate-900/70 text-slate-400 hover:text-slate-200'"
                        class="px-2.5 py-1.5 rounded-lg border text-[10px] transition text-left">
                  <b class="font-mono mr-1" x-text="node.visit_order"></b>
                  <span x-text="node.name"></span>
                  <span x-show="node.id === campaignMap?.current_node_id" class="text-cyan-400 ml-1">●</span>
                </button>
              </template>
            </div>
            <p class="text-[10px] text-gray-600 mt-2">Mapa jest tylko podglądem. Pozycję i odkrycia aktualizuje przebieg opowieści po zakończeniu tury.</p>
          </div>
        </div>
        <div class="flex flex-wrap gap-4 mt-3 text-[10px] font-mono text-gray-500">
          <span><i class="campaign-map-legend campaign-map-legend--current"></i> drużyna</span>
          <span><i class="campaign-map-legend campaign-map-legend--available"></i> niezbadane przejście</span>
          <span><i class="campaign-map-legend campaign-map-legend--visited"></i> odwiedzona</span>
          <span><i class="campaign-map-legend campaign-map-legend--hidden"></i> nieodkryta</span>
        </div>
      </div>
    </div>
  </div>
