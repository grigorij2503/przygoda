  <!-- ==================== MODAL: OSOBISTY NOTES GRACZA ==================== -->
  <div x-show="showPersonalNoteModal" @keydown.escape.window="showPersonalNoteModal && closePersonalNote()"
       role="dialog" aria-modal="true" aria-labelledby="note-dialog-title"
       class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
    <div class="fantasy-card p-6 md:p-8 rounded-2xl max-w-2xl w-full border border-emerald-900/60 shadow-2xl flex flex-col" @click.stop>
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
        <div>
          <h3 id="note-dialog-title" class="text-2xl font-fantasy font-bold text-emerald-300 flex items-center gap-2">
            <span>📓</span> MÓJ NOTES
          </h3>
          <p class="text-xs text-gray-400 mt-1" x-text="currentCharacter ? currentCharacter.player_name + ' • ' + currentCharacter.name : ''"></p>
        </div>
        <button @click="closePersonalNote()" class="text-gray-400 hover:text-white text-lg" aria-label="Zamknij notes">✕</button>
      </div>

      <div x-show="isLoadingPersonalNote" class="h-72 flex items-center justify-center text-sm text-gray-400">
        Wczytywanie notatki...
      </div>

      <div x-show="!isLoadingPersonalNote" class="space-y-3">
        <label for="personal-note" class="sr-only">Treść osobistego notesu</label>
        <textarea id="personal-note" x-model="personalNote" x-ref="personalNoteTextarea" maxlength="20000" rows="13"
                  @keydown.ctrl.s.prevent="savePersonalNote()" @keydown.meta.s.prevent="savePersonalNote()"
                  placeholder="Zapisz tropy, plany, sekrety, ważne imiona i wszystko, co przyda się Twojej postaci..."
                  class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-sm leading-relaxed text-gray-100 placeholder-gray-600 focus:outline-none focus:border-emerald-500 transition resize-y min-h-64"></textarea>

        <div class="flex items-center justify-between gap-3 text-[11px]">
          <span :class="isPersonalNoteDirty ? 'text-amber-400' : 'text-gray-500'"
                x-text="isPersonalNoteDirty ? 'Masz niezapisane zmiany' : 'Notatka zapisana'"></span>
          <span class="text-gray-500" x-text="personalNote.length + ' / 20000'"></span>
        </div>

        <p x-show="personalNoteError" x-text="personalNoteError" class="text-rose-300 text-xs bg-rose-950/40 border border-rose-800 rounded-lg p-3"></p>

        <div class="flex gap-3 pt-2">
          <button type="button" @click="closePersonalNote()"
                  class="flex-1 py-2.5 bg-slate-900 hover:bg-slate-800 text-gray-300 rounded-lg text-xs font-fantasy transition">
            Zamknij
          </button>
          <button type="button" @click="savePersonalNote()"
                  :disabled="isSavingPersonalNote || !isPersonalNoteDirty || personalNote.length > 20000"
                  class="flex-1 py-2.5 bg-emerald-700 hover:bg-emerald-600 text-white rounded-lg text-xs font-fantasy font-bold transition disabled:opacity-50">
            <span x-show="!isSavingPersonalNote">ZAPISZ NOTATKĘ</span>
            <span x-show="isSavingPersonalNote">ZAPISYWANIE...</span>
          </button>
        </div>
      </div>
    </div>
  </div>
