  <!-- ==================== MODAL: AKCJA ZASTĘPCZA DRUŻYNY ==================== -->
  <div x-show="showProxyActionModal" x-cloak
       @keydown.escape.window="closeProxyActionVote()"
       role="dialog" aria-modal="true" aria-labelledby="proxy-dialog-title"
       class="fixed inset-0 z-[70] bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="fantasy-card p-5 md:p-7 rounded-2xl max-w-xl w-full border border-indigo-500/50 shadow-2xl relative">
      <button type="button" @click="closeProxyActionVote()" :disabled="isSubmittingProxyVote"
              class="absolute top-3 right-3 text-gray-400 hover:text-white text-xl" aria-label="Zamknij">×</button>

      <div class="pr-8">
        <p class="text-[10px] uppercase tracking-[0.2em] text-indigo-300 mb-1">Akcja zastępcza drużyny</p>
        <h3 id="proxy-dialog-title" class="text-xl font-fantasy font-bold text-amber-300">
          Wybierz ruch dla <span x-text="proxyTargetCharacter?.name"></span>
        </h3>
        <p class="text-xs text-gray-400 mt-2">
          Głos można zmienić do zamknięcia głosowania. Powracający gracz nadal może zastąpić wynik własną deklaracją.
        </p>
      </div>

      <div class="mt-4 px-3 py-2 rounded-lg bg-slate-950/70 border border-slate-800 flex items-center justify-between text-[11px]">
        <span class="text-gray-400" x-text="proxyVoteTimeLabel()"></span>
        <span class="text-indigo-300 font-semibold"
              x-text="'Potrzeba ' + (proxyDecision?.quorum || Math.floor((totalAlivePlayers - 1) / 2) + 1) + ' głosów'"></span>
      </div>

      <div class="mt-4 space-y-2">
        <template x-for="option in proxyOptions" :key="option.id">
          <button type="button" @click="submitProxyVote(option.id)" :disabled="isSubmittingProxyVote"
                  class="w-full text-left p-3 rounded-xl border transition disabled:opacity-60"
                  :class="myProxyVoteOptionId === option.id
                    ? 'bg-indigo-900/50 border-indigo-400 text-white ring-1 ring-indigo-400/50'
                    : 'bg-slate-950/70 border-slate-800 text-gray-200 hover:border-indigo-500/60 hover:bg-slate-900'">
            <div class="flex items-center justify-between gap-3">
              <span class="font-fantasy font-bold text-sm">
                <span x-text="option.icon"></span> <span x-text="option.label"></span>
              </span>
              <span class="shrink-0 px-2 py-0.5 rounded-full bg-slate-900 text-indigo-300 text-[10px]"
                    x-text="(option.votes || 0) + ' gł.'"></span>
            </div>
            <p class="text-[11px] text-gray-400 mt-1" x-text="option.description"></p>
          </button>
        </template>
      </div>

      <p x-show="proxyVoteError" x-text="proxyVoteError"
         class="mt-3 text-xs text-red-300 bg-red-950/40 border border-red-700/40 rounded-lg px-3 py-2"></p>
      <p class="mt-3 text-[10px] text-gray-500"
         x-text="'Przy braku większości po ' + (session?.proxy_action_config?.vote_hours || 2) + ' godz. wygrywa najpopularniejsza opcja; remis albo brak głosów oznacza obronę.'">
      </p>
    </div>
  </div>
