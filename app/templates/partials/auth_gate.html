  <!-- ==================== EKRAN 1: BRAMA / HASŁO ==================== -->
  <div x-show="!isAuthenticated" class="min-h-screen flex items-center justify-center p-4">
    <div class="fantasy-card p-8 rounded-2xl max-w-md w-full text-center border border-amber-900/40 relative overflow-hidden">
      <div class="absolute -top-12 -left-12 w-32 h-32 bg-amber-600/10 rounded-full blur-3xl pointer-events-none"></div>
      
      <div class="w-20 h-20 mx-auto mb-4 rounded-2xl border border-amber-500/30 p-1.5 flex items-center justify-center bg-slate-950/80 shadow-xl shadow-amber-500/10">
        <img src="/static/icons/icon.svg" alt="Logo Przygoda RPG" class="w-full h-full object-contain">
      </div>
      <h1 class="text-3xl font-fantasy font-bold text-amber-300 tracking-wider mb-2">BRAMA PRZYGODY</h1>
      <p class="text-gray-400 text-sm mb-6">Wpisz hasło do stołu gry, aby dołączyć do drużyny i rozpocząć sesję z Mistrzem Gry Gemini.</p>

      <form @submit.prevent="login()" class="space-y-4">
        <div>
          <label for="room-password" class="block text-xs font-semibold text-amber-400/80 uppercase tracking-widest text-left mb-1">Hasło do Pokoju</label>
          <input id="room-password" type="password" x-model="roomPassword" placeholder="Wpisz hasło sesji..."
                 class="w-full bg-slate-950/80 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition">
        </div>

        <div x-show="authError" x-text="authError" class="text-red-400 text-sm font-medium bg-red-950/50 border border-red-800/50 rounded-lg p-2.5"></div>

        <button type="submit" :disabled="isLoggingIn"
                class="w-full py-3.5 px-4 bg-gradient-to-r from-amber-700 via-amber-600 to-amber-700 hover:from-amber-600 hover:to-amber-500 text-slate-950 font-fantasy font-bold rounded-lg shadow-lg shadow-amber-900/30 transition transform hover:-translate-y-0.5 disabled:opacity-50">
          <span x-show="!isLoggingIn">PRZEKROCZ BRAMĘ</span>
          <span x-show="isLoggingIn">WERYFIKACJA...</span>
        </button>

        <!-- Przycisk Instalacji PWA na ekranie logowania -->
        <template x-if="canInstallPWA">
          <div class="pt-2">
            <button type="button" @click="installPWA()"
                    class="w-full py-2.5 px-4 bg-slate-900/90 hover:bg-slate-800 text-amber-300 border border-amber-500/40 rounded-lg text-xs font-fantasy flex items-center justify-center gap-2 transition shadow-md">
              <span>📲</span> ZAINSTALUJ JAKO APLIKACJĘ (PWA)
            </button>
          </div>
        </template>
      </form>
    </div>
  </div>
