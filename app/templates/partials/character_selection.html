  <!-- ==================== EKRAN 2: WYBÓR / TWORZENIE POSTACI (DLA TOČĄCEJ SIĘ GRY) ==================== -->
  <div x-show="isAuthenticated && session?.status !== 'lobby' && !selectedCharacterId" class="min-h-screen p-6 max-w-4xl mx-auto flex flex-col justify-center">
    <div class="fantasy-card p-8 rounded-2xl border border-amber-900/40 shadow-2xl">
      <div class="flex flex-wrap items-center justify-between gap-4 mb-8 pb-4 border-b border-slate-800">
        <div>
          <h2 class="text-2xl font-fantasy font-bold text-amber-300">WYBIERZ SWOJEGO BOHATERA</h2>
          <p class="text-gray-400 text-sm">Dołącz do toczącej się przygody lub powołaj do życia nową postać.</p>
        </div>
        <div class="flex items-center gap-3">
          <template x-if="canInstallPWA">
            <button @click="installPWA()" class="text-xs font-fantasy bg-amber-600/20 hover:bg-amber-600/30 border border-amber-500/50 text-amber-300 px-3 py-2 rounded-lg transition flex items-center gap-1.5 shadow-sm">
              <span>📲</span> Zainstaluj PWA
            </button>
          </template>
          <button @click="openGmTools()" class="text-xs font-fantasy bg-slate-800 hover:bg-slate-700 border border-slate-700 text-gray-300 px-3 py-2 rounded-lg transition flex items-center gap-1.5">
            <span>🔒</span> Narzędzia MG
          </button>
          <button @click="logout()" class="text-xs font-fantasy bg-red-950/60 hover:bg-red-900 border border-red-700/40 text-red-300 px-3 py-2 rounded-lg transition">
            Wyloguj
          </button>
        </div>
      </div>

      <!-- Lista istniejących postaci -->
      <div class="mb-8">
        <h3 class="text-sm font-semibold uppercase tracking-wider text-gray-400 mb-4">Postacie w tej sesji:</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <template x-for="char in session?.characters || []" :key="char.id">
            <div @click="selectCharacter(char.id)"
                 class="group p-5 bg-slate-900/80 hover:bg-slate-800/90 border border-slate-800 hover:border-amber-500/60 rounded-xl cursor-pointer transition transform hover:-translate-y-1 relative overflow-hidden">
              <div class="flex items-start justify-between mb-2">
                <div>
                  <h4 class="text-lg font-fantasy font-bold text-amber-200 group-hover:text-amber-400 transition" x-text="char.name"></h4>
                  <p class="text-xs text-gray-400"><span x-text="char.character_class"></span> • Poziom <span x-text="char.level"></span></p>
                </div>
                <span class="text-xs bg-amber-500/10 border border-amber-500/30 text-amber-300 px-2.5 py-1 rounded-full font-mono">
                  Gracz: <span x-text="char.player_name"></span>
                </span>
              </div>

              <!-- Statystyki w pigułce -->
              <div class="grid grid-cols-4 gap-2 text-center text-xs my-3 py-2 bg-slate-950/60 rounded-lg border border-slate-800">
                <div><span class="text-gray-500 block">SIŁ</span><b class="text-amber-300" x-text="'+' + char.strength"></b></div>
                <div><span class="text-gray-500 block">ZRĘ</span><b class="text-amber-300" x-text="'+' + char.agility"></b></div>
                <div><span class="text-gray-500 block">ROZ</span><b class="text-amber-300" x-text="'+' + char.intellect"></b></div>
                <div><span class="text-gray-500 block">CHA</span><b class="text-amber-300" x-text="'+' + char.charisma"></b></div>
              </div>

              <div class="flex items-center justify-between text-xs mt-3">
                <span class="text-red-400 flex items-center gap-1">
                  ❤️ <span x-text="char.current_hp + ' / ' + char.max_hp"></span> HP
                </span>
                <div class="flex items-center gap-3">
                  <button @click.stop="deleteCharacter(char.id, char.name)"
                    class="text-gray-600 hover:text-red-400 transition opacity-0 group-hover:opacity-100"
                    title="Usuń postać">
                    🗑️
                  </button>
                  <span class="text-amber-400 flex items-center gap-1 font-fantasy group-hover:translate-x-1 transition">
                    Graj tą postacią →
                  </span>
                </div>
              </div>
            </div>
          </template>
        </div>

        <div x-show="session?.characters?.length === 0" class="text-center py-10 bg-slate-900/40 rounded-xl border border-dashed border-slate-800">
          <p class="text-gray-500 text-sm mb-2">Brak aktywnych postaci w tej sesji.</p>
          <p class="text-xs text-amber-400/80">Stwórz pierwszego bohatera, by poprowadzić drużynę!</p>
        </div>
      </div>

      <!-- Przycisk Nowej Postaci -->
      <button @click="showCharModal = true"
              class="w-full py-4 bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 hover:border-amber-500 border border-amber-500/40 rounded-xl text-amber-300 font-fantasy font-semibold flex items-center justify-center gap-2 transition shadow-lg">
        <span class="text-xl">⚔️</span> STWÓRZ NOWĄ POSTAĆ
      </button>
    </div>
  </div>
