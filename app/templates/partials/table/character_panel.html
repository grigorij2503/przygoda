        <!-- KARTA TWOJEJ POSTACI -->

            </div>
            <span class="px-2.5 py-1 rounded-full text-xs font-mono"

          </div>

          <div x-show="(currentCharacter?.status_effects || []).length > 0" class="flex flex-wrap gap-1.5 mb-4">
            <template x-for="effect in currentCharacter?.status_effects || []" :key="effect.type">

                <span x-text="'• ' + effect.turns_remaining + ' t.'"></span>
              </span>
            </template>
          </div>

          <!-- Pasek Zdrowia (HP) -->
          <div class="mb-4">

              <span class="font-mono text-gray-300" x-text="currentCharacter?.current_hp + ' / ' + currentCharacter?.max_hp"></span>
            </div>
            <div class="w-full h-3 bg-slate-950 rounded-full overflow-hidden border border-slate-800 p-0.5">
              <div class="hp-fill h-full rounded-full"
                   :style="'width: ' + Math.max(0, Math.min(100, (currentCharacter?.current_hp / currentCharacter?.max_hp) * 100)) + '%'"></div>
            </div>
          </div>

          <!-- Pasek Doświadczenia (XP) -->
          <div class="mb-5">
            <div class="flex justify-between text-xs font-semibold mb-1">
              <span class="text-amber-400 flex items-center gap-1">⭐ Doświadczenie</span>
              <span class="font-mono text-gray-300" x-text="currentCharacter?.xp + ' XP'"></span>
            </div>
            <div class="w-full h-2 bg-slate-950 rounded-full overflow-hidden border border-slate-800 p-0.5">
              <div class="xp-fill h-full rounded-full"

            </div>
            <div class="mt-1 text-right text-[10px] font-mono text-gray-500"

                   ? ('Do poziomu ' + currentCharacter.xp_next_level + ': ' + currentCharacter.xp_progress_current + ' / ' + currentCharacter.xp_progress_required)

          </div>

          <button x-show="(currentCharacter?.unspent_stat_points || 0) > 0" x-cloak
                  type="button" @click="statPointError = ''; showLevelUpModal = true"
                  class="w-full mb-5 px-4 py-3 rounded-xl border border-amber-500/60 bg-gradient-to-r from-amber-950/80 to-yellow-950/60 hover:border-amber-400 text-amber-200 text-xs font-fantasy font-bold transition shadow-lg shadow-amber-950/30 flex items-center justify-center gap-2">
            <span>⭐</span>
            <span>ROZDAJ PUNKTY ATRYBUTÓW</span>
            <span class="min-w-6 h-6 px-1.5 rounded-full bg-amber-500 text-slate-950 flex items-center justify-center font-mono"
                  x-text="currentCharacter?.unspent_stat_points"></span>
          </button>

          <!-- Atrybuty Postaci -->

                      <span class="text-emerald-400" x-text="'ekw. ' + formatSignedStat(equipmentStatBonus('strength'))"></span>

                  </span>
                  <span class="absolute top-1.5 right-2 text-[10px] text-gray-600">ⓘ</span>

                  <b class="text-amber-300 block mb-1" x-text="`${attributeDefinition('strength').label} (${attributeDefinition('strength').abbreviation})`"></b>

                </div>

                  <span class="mt-1 flex items-center justify-center gap-1.5 text-[9px] leading-none font-mono">
                    <span class="text-gray-500" x-text="'baz. ' + formatSignedStat(currentCharacter?.agility)"></span>
                    <template x-if="equipmentStatBonus('agility') !== 0">
                      <span class="text-emerald-400" x-text="'ekw. ' + formatSignedStat(equipmentStatBonus('agility'))"></span>
                    </template>
                  </span>
                  <span class="absolute top-1.5 right-2 text-[10px] text-gray-600">ⓘ</span>
                </button>
                <div x-show="showInfo" x-cloak x-transition @click.outside="showInfo = false"
                     class="absolute z-40 bottom-full right-0 mb-2 w-56 p-3 rounded-lg border border-amber-700/60 bg-slate-950 shadow-2xl text-left text-[11px] leading-relaxed text-gray-300">
                  <b class="text-amber-300 block mb-1" x-text="`${attributeDefinition('agility').label} (${attributeDefinition('agility').abbreviation})`"></b>
                  <span x-text="attributeDefinition('agility').description"></span>
                </div>
              </div>
              <div x-data="infoPopover" class="relative">
                <button type="button" @click="showInfo = !showInfo" @keydown.escape.window="showInfo = false"
                        :aria-expanded="showInfo" :aria-label="`Wyjaśnij atrybut ${attributeDefinition('intellect').label}`"
                        class="w-full bg-slate-950/80 hover:border-amber-600/60 p-2.5 rounded-lg border border-slate-800 text-center transition relative">
                  <span class="text-[10px] text-gray-500 block uppercase" x-text="`${attributeDefinition('intellect').label} (${attributeDefinition('intellect').abbreviation})`"></span>
                  <span class="text-lg leading-tight font-bold text-amber-300 block" x-text="formatSignedStat(totalCharacterStat('intellect'))"></span>
                  <span class="mt-1 flex items-center justify-center gap-1.5 text-[9px] leading-none font-mono">
                    <span class="text-gray-500" x-text="'baz. ' + formatSignedStat(currentCharacter?.intellect)"></span>
                    <template x-if="equipmentStatBonus('intellect') !== 0">

                  <b class="text-amber-300 block mb-1" x-text="`${attributeDefinition('intellect').label} (${attributeDefinition('intellect').abbreviation})`"></b>
                  <span x-text="attributeDefinition('intellect').description"></span>
                </div>
              </div>
              <div x-data="infoPopover" class="relative">
                <button type="button" @click="showInfo = !showInfo" @keydown.escape.window="showInfo = false"
                        :aria-expanded="showInfo" :aria-label="`Wyjaśnij atrybut ${attributeDefinition('charisma').label}`"
                        class="w-full bg-slate-950/80 hover:border-amber-600/60 p-2.5 rounded-lg border border-slate-800 text-center transition relative">

                  <span class="text-lg leading-tight font-bold text-amber-300 block" x-text="formatSignedStat(totalCharacterStat('charisma'))"></span>
                  <span class="mt-1 flex items-center justify-center gap-1.5 text-[9px] leading-none font-mono">

          <!-- Księga zdolności pochodzi z klasy zadeklarowanej w aktywnym pakiecie świata. -->
          <section x-show="abilityBook" x-cloak class="mb-6 rounded-xl border border-violet-800/60 bg-gradient-to-br from-violet-950/45 to-slate-950/80 p-4">
            <div class="flex items-start justify-between gap-3 mb-3">
              <div>
                <h4 class="text-xs font-fantasy font-bold uppercase tracking-widest text-violet-300">
                  <span x-text="abilityBook?.icon"></span>
                  <span x-text="abilityBook?.title"></span>
                </h4>
                <p class="text-[10px] text-gray-500 mt-1">Kliknij odblokowaną zdolność, aby przygotować deklarację akcji.</p>
              </div>
              <span class="shrink-0 rounded-md border border-violet-700/50 bg-violet-950/70 px-2 py-1 text-[9px] font-mono text-violet-300"
                    x-text="abilityBook ? (abilityBook.resource_label + ' • ' + statShortLabel(abilityBook.casting_stat)) : ''"></span>
            </div>

            <div class="space-y-2 max-h-80 overflow-y-auto pr-1">
              <template x-for="ability in abilityBook?.abilities || []" :key="ability.id">
                <button type="button" @click="selectMagicAbility(ability)"
                        :disabled="!ability.unlocked || hasSubmittedCurrentTurn || session?.is_turn_resolving"
                        class="w-full rounded-lg border p-3 text-left transition disabled:cursor-not-allowed"
                        :class="ability.unlocked
                          ? (magicAbilityId === ability.id
                            ? 'border-violet-400 bg-violet-900/45 shadow-lg shadow-violet-950/30'
                            : 'border-slate-700/80 bg-slate-950/70 hover:border-violet-500/70 hover:bg-violet-950/30')
                          : 'border-slate-800 bg-slate-950/40 opacity-55'">
                  <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0">
                      <div class="flex items-center gap-2">
                        <span x-text="ability.icon"></span>
                        <strong class="text-xs text-violet-100" x-text="ability.name"></strong>
                      </div>
                      <p class="mt-1 text-[10px] leading-relaxed text-gray-400" x-text="ability.description"></p>
                    </div>
                    <span class="shrink-0 rounded px-1.5 py-0.5 text-[9px] font-mono"
                          :class="ability.unlocked ? 'bg-emerald-950 text-emerald-300 border border-emerald-700/50' : 'bg-slate-900 text-gray-500 border border-slate-700'"
                          x-text="ability.unlocked ? 'DOSTĘPNA' : ('POZIOM ' + ability.required_level)"></span>
                  </div>
                  <div class="mt-2 text-[9px] uppercase tracking-wider text-violet-400/70" x-text="ability.category"></div>
                </button>
              </template>
            </div>
          </section>
