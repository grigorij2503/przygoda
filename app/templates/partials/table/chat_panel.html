        <!-- CZAT DRUŻYNY (NARADA TAKTYCZNA PRZED AKCJĄ) -->
        <div class="fantasy-card p-5 rounded-2xl border border-indigo-950/80 shadow-xl">
          <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
            <h4 class="text-xs font-fantasy font-bold uppercase tracking-wider text-indigo-300 flex items-center gap-2">
              <span>💬</span> CZAT DRUŻYNY (NARADA)
            </h4>
            <div class="flex items-center gap-1.5">
              <button type="button" @click="togglePushNotifications()"
                      :disabled="pushBusy"
                      :aria-pressed="pushEnabled"
                      :title="pushButtonTitle"
                      class="text-[10px] text-indigo-300 hover:text-white disabled:text-gray-600 disabled:cursor-not-allowed rounded px-2 py-1 border border-slate-700"
                      x-text="pushButtonLabel"></button>
              <button type="button" @click="toggleNotificationSound()"
                      :aria-pressed="notificationSoundEnabled"
                      :aria-label="notificationSoundEnabled ? 'Wycisz powiadomienia czatu i tur' : 'Włącz dźwięk powiadomień czatu i tur'"
                      title="Dźwięk oznaczeń @ i zakończenia tury. Aktywuje się po kliknięciu lub naciśnięciu klawisza na stronie."
                      class="text-[10px] text-indigo-300 hover:text-white rounded px-2 py-1 border border-slate-700"
                      x-text="notificationSoundEnabled ? '🔔 Dźwięk wł.' : '🔕 Dźwięk wył.'"></button>
            </div>
          </div>

          <!-- Okno Wiadomości -->
          <div id="chat-messages-container" class="h-48 overflow-y-auto space-y-2 pr-1 text-xs mb-3">
            <template x-for="(msg, idx) in chatMessages" :key="idx">
              <div class="p-2 rounded-lg border"
                   :class="isMentionedInChat(msg) ? 'bg-amber-950/60 border-amber-500/70' : 'bg-slate-950/70 border-slate-800/80'">
                <div class="flex items-center justify-between text-[10px] mb-1">
                  <span class="font-bold text-amber-300 font-fantasy" x-text="msg.author"></span>
                  <div class="flex items-center gap-1.5 text-gray-500">
                    <span class="bg-indigo-950 text-indigo-300 px-1 rounded text-[9px]" x-text="msg.character_class"></span>
                    <span x-text="formatChatTime(msg.time)"></span>
                  </div>
                </div>
                <span x-show="isMentionedInChat(msg)" class="block text-[10px] font-bold text-amber-300 mb-1">@ Wspomniano o Tobie</span>
                <p class="text-gray-300 leading-snug break-words" x-text="msg.text"></p>
              </div>
            </template>

            <div x-show="chatMessages.length === 0" class="text-center py-8 text-gray-500 text-xs italic">
              Narada milczy. Ustalcie plan działania przed złożeniem akcji na tę turę!
            </div>
          </div>

          <!-- Szybkie Okrzyki -->
          <div class="flex flex-wrap gap-1 mb-2">
            <button @click="sendQuickChat('🛡️ Trzymajcie szyk! Ja przyjmuję pierwsze uderzenie.')" class="text-[10px] bg-slate-900 hover:bg-slate-800 border border-slate-800 text-gray-300 px-2 py-0.5 rounded transition">
              🛡️ Trzymać szyk!
            </button>
            <button @click="sendQuickChat('✨ Przygotowuję potężne zaklęcie, dajcie mi chwilę!')" class="text-[10px] bg-slate-900 hover:bg-slate-800 border border-slate-800 text-gray-300 px-2 py-0.5 rounded transition">
              ✨ Gotuję czar!
            </button>
            <button @click="sendQuickChat('🏹 Osłaniam was z tyłu, idźcie pierwsi!')" class="text-[10px] bg-slate-900 hover:bg-slate-800 border border-slate-800 text-gray-300 px-2 py-0.5 rounded transition">
              🏹 Osłaniam was!
            </button>
          </div>

          <!-- Pole wprowadzania -->
          <form @submit.prevent="sendChatMessage()" class="flex gap-2">
            <div class="relative flex-1 min-w-0" @click.outside="chatMention = null">
              <div x-show="chatMentionOptions.length > 0" x-cloak id="chat-mentions" role="listbox"
                   aria-label="Oznacz gracza" class="absolute bottom-full left-0 right-0 mb-2 max-h-40 overflow-y-auto rounded-lg border border-indigo-700 bg-slate-950 shadow-xl z-20">
                <template x-for="(option, index) in chatMentionOptions" :key="option.id">
                  <button type="button" role="option" :id="`chat-mention-${index}`"
                          :aria-selected="index === chatMentionIndex" tabindex="-1"
                          @mousedown.prevent @click="selectChatMention(option)"
                          :class="index === chatMentionIndex ? 'bg-indigo-900 text-white' : 'text-gray-300'"
                          class="block w-full px-3 py-2 text-left text-xs hover:bg-indigo-900">
                    <span class="font-bold" x-text="'@' + option.name"></span>
                    <span x-show="option.id === 'all'" class="ml-2 text-indigo-300" x-text="option.label"></span>
                  </button>
                </template>
              </div>
              <input type="text" x-model="chatInput" x-ref="chatInput" placeholder="Wiadomość... @gracz lub @all"
                     role="combobox" aria-label="Wiadomość do drużyny" aria-autocomplete="list" aria-controls="chat-mentions"
                     :aria-expanded="chatMentionOptions.length > 0"
                     :aria-activedescendant="chatMentionOptions.length ? `chat-mention-${chatMentionIndex}` : null"
                     @input="updateChatMention($event.target)" @click="updateChatMention($event.target)"
                     @keyup="if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes($event.key)) updateChatMention($event.target)"
                     @keydown="handleChatMentionKey($event)"
                     class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition">
            </div>
            <button type="submit" class="px-3 py-1.5 bg-indigo-900 hover:bg-indigo-800 text-indigo-200 rounded-lg text-xs font-fantasy font-bold transition">
              Wyślij
            </button>
          </form>
        </div>
