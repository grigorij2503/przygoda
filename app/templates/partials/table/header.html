    <!-- HEADER -->
    <header class="mobile-header bg-slate-950/90 border-b border-amber-900/40 sticky top-0 z-30 backdrop-blur-md px-4 lg:px-8 py-3"
            :class="{ 'mobile-header--collapsed': mobileHeaderCollapsed }">
      <!-- Jednowierszowy nagłówek widoczny po zwinięciu na telefonie lub mniejszym ekranie komputera. -->
      <button type="button" @click="mobileHeaderCollapsed = false"
              class="mobile-header-summary w-full max-w-7xl mx-auto items-center justify-between gap-3 text-left"
              :aria-expanded="(!mobileHeaderCollapsed).toString()" aria-label="Rozwiń panel sesji">
        <span class="flex items-center gap-2 min-w-0">
          <span class="ui-world-emblem text-lg shrink-0" aria-hidden="true">🏰</span>
          <span class="min-w-0">
            <strong class="block truncate text-sm font-fantasy text-amber-300" x-text="session?.title"></strong>
            <span class="block text-[10px] text-gray-400">
              Tura #<b class="text-white" x-text="session?.current_turn_number"></b>
              <span x-show="activeEnemy"> • <span class="text-red-300" x-text="activeEnemy?.name"></span></span>
            </span>
          </span>
        </span>
        <span class="flex items-center gap-2 shrink-0">
          <span x-show="activeEnemy" class="text-[10px] font-mono text-red-300"
                x-text="'HP ' + activeEnemy?.hp + '/' + activeEnemy?.max_hp"></span>
          <svg class="w-4 h-4 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </span>
      </button>

      <div class="mobile-header-content max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <span class="ui-world-emblem text-2xl" aria-hidden="true">🏰</span>
          <div>
            <h1 class="ui-heading text-lg font-fantasy font-bold text-amber-300 leading-tight" x-text="session?.title"></h1>
            <p class="text-xs text-gray-400">
              <span class="text-amber-500/90" x-text="session?.setting_theme"></span> • 
              <span>Tura #<b class="text-white" x-text="session?.current_turn_number"></b></span>
            </p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <button type="button" @click="mobileHeaderCollapsed = true"
                  class="compact-panel-collapse-trigger text-xs font-fantasy bg-slate-900 hover:bg-slate-800 border border-slate-700 text-gray-300 px-3 py-1.5 rounded-lg transition items-center gap-1.5"
                  aria-label="Zwiń panel sesji">
            <span>Zwiń</span>
            <svg class="w-3.5 h-3.5 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>

          <!-- Status gotowości w turze -->
          <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs">
            <span class="w-2 h-2 rounded-full" :class="wsConnected ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'"></span>
            <span class="text-gray-400">Stan tury:</span>
            <span class="font-semibold" :class="hasSubmittedCurrentTurn ? 'text-emerald-400' : 'text-amber-400'">
              <span x-text="readyCount"></span> / <span x-text="totalAlivePlayers"></span> gotowych
            </span>
          </div>

          <!-- Szybki przycisk rozstrzygnięcia w headerze -->
          <template x-if="readyCount >= totalAlivePlayers && totalAlivePlayers > 0 && !session?.is_turn_resolving">
            <button @click="triggerTurnResolution()" :disabled="isResolvingTurn"
                    class="text-xs font-fantasy bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-slate-950 px-3 py-1.5 rounded-lg font-bold transition flex items-center gap-1.5 shadow-md animate-pulse">
              <span class="ui-theme-icon ui-theme-icon--action" aria-hidden="true">⚔️</span> Rozstrzygnij Turę
            </button>
          </template>

          <!-- Przycisk Kroniki Świata (Lore Book) -->
          <button @click="showLoreBookModal = true" class="text-xs font-fantasy bg-slate-900 hover:bg-slate-800 border border-amber-500/40 text-amber-300 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-sm">
            <span class="ui-theme-icon ui-theme-icon--lore" aria-hidden="true">📜</span> <span class="hidden md:inline">Kronika Świata</span>
            <span class="bg-amber-500/20 text-amber-400 px-1.5 py-0.2 rounded-full text-[10px]" x-text="session?.lore_entities?.length || 0"></span>
          </button>

          <!-- Szybki powrót do nowego rozstrzygnięcia albo bieżącej tury -->
          <button @click="openNewestStoryContent()" type="button"
                  class="relative text-xs font-fantasy bg-slate-900 hover:bg-slate-800 border border-amber-500/40 text-amber-300 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-sm"
                  :class="hasUnreadTurn ? 'ring-2 ring-amber-400/70 animate-pulse' : ''"
                  :aria-label="hasUnreadTurn ? 'Przejdź do nowego rozstrzygnięcia' : 'Przejdź do bieżącej tury'">
            <span x-text="hasUnreadTurn ? '📜' : '⚡'"></span>
            <span class="hidden md:inline" x-text="hasUnreadTurn ? 'Nowe wydarzenie' : 'Bieżąca tura'"></span>
            <span x-show="hasUnreadTurn" x-cloak class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-amber-400 border-2 border-slate-950"></span>
          </button>

          <!-- Wspólna mapa wyprawy -->
          <button @click="openMap()" title="Mapa wspólnej wyprawy"
                  class="text-xs font-fantasy bg-slate-900 hover:bg-slate-800 border border-cyan-500/40 text-cyan-300 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-sm">
            <span class="ui-theme-icon ui-theme-icon--map" aria-hidden="true">🗺️</span> <span class="hidden md:inline">Mapa</span>
          </button>

          <!-- Osobisty notes wybranej postaci -->
          <button @click="openPersonalNote()" title="Osobisty notes gracza"
                  class="text-xs font-fantasy bg-slate-900 hover:bg-slate-800 border border-emerald-500/40 text-emerald-300 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-sm">
            <span>📓</span> <span class="hidden md:inline">Mój Notes</span>
          </button>

          <!-- Przycisk instalacji PWA w Headerze -->
          <template x-if="canInstallPWA">
            <button @click="installPWA()" title="Zainstaluj na urządzeniu"
                    class="text-xs font-fantasy bg-amber-600/20 hover:bg-amber-600/30 border border-amber-500/50 text-amber-300 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-sm">
              <span>📲</span> <span class="hidden md:inline">Zainstaluj PWA</span>
            </button>
          </template>

          <!-- Przełącz postać / wyloguj -->
          <button @click="selectedCharacterId = null" class="text-xs font-fantasy bg-slate-900 hover:bg-slate-800 border border-slate-700 text-gray-300 px-3 py-1.5 rounded-lg transition">
            Zmień Postać
          </button>

          <!-- Operacje administracyjne są ukryte za sesją MG zabezpieczoną PIN-em. -->
          <button @click="openGmTools()" title="Narzędzia Mistrza Gry"
                  class="text-xs font-fantasy bg-slate-950 hover:bg-slate-900 border border-slate-800 text-gray-500 hover:text-gray-300 px-2.5 py-1.5 rounded-lg transition flex items-center gap-1.5">
            <span>🔒</span> <span class="hidden xl:inline">MG</span>
          </button>
        </div>
      </div>

      <!-- Pasek aktywnego przeciwnika pozostaje nad przewijaną kroniką. -->
      <div x-show="activeEnemy" x-cloak
           class="mobile-header-content max-w-7xl mx-auto mt-3 p-3 rounded-xl border bg-gradient-to-r from-red-950/95 via-black to-red-950/95 shadow-2xl overflow-hidden"
           :class="activeEnemy?.hp <= 0 ? 'border-slate-600/70' : 'border-red-700/60'">
        <div class="flex items-center justify-between gap-3 mb-1.5">
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-xl" :class="activeEnemy?.hp > 0 ? 'animate-pulse' : ''" x-text="enemyProfile.icon || '⚠️'"></span>
            <div class="min-w-0">
              <span class="text-[9px] uppercase font-mono tracking-widest text-red-400 block truncate" x-text="activeEnemy?.title"></span>
              <h3 class="text-sm font-fantasy font-bold truncate"
                  :class="activeEnemy?.hp <= 0 ? 'text-gray-400 line-through' : 'text-red-200'"
                  x-text="activeEnemy?.name"></h3>
            </div>
          </div>
          <span class="shrink-0 text-[11px] font-mono px-2.5 py-1 rounded-md border"
                :class="activeEnemy?.hp <= 0 ? 'text-gray-300 bg-slate-900 border-slate-700' : 'text-red-300 bg-red-900/40 border-red-700/50'">
            <span x-show="activeEnemy?.hp <= 0" x-text="(enemyProfile.defeated_label || 'pokonany').toUpperCase() + ' • '"></span>
            HP: <span x-text="activeEnemy?.hp + ' / ' + activeEnemy?.max_hp"></span>
          </span>
        </div>
        <div class="flex flex-wrap items-center gap-1.5 mb-2 text-[10px] font-mono">
          <span class="px-2 py-0.5 rounded border border-red-800/70 bg-red-950/70 text-red-200"
                x-text="'FAZA ' + (activeEnemy?.phase || 1) + '/3'"></span>
          <span class="px-2 py-0.5 rounded border border-slate-700 bg-slate-950/70 text-gray-300"
                x-text="'🛡 Pancerz ' + (activeEnemy?.armor || 0)"></span>
          <span class="px-2 py-0.5 rounded border border-slate-700 bg-slate-950/70 text-gray-300"
                x-text="'🎲 DC ' + (activeEnemy?.defense_dc || 12)"></span>
          <template x-for="effect in activeEnemy?.effects || []" :key="effect.type">
            <span class="px-2 py-0.5 rounded border cursor-help"
                  :class="statusClass(effect)" :title="statusTooltip(effect)">
              <span x-text="effect.icon"></span>
              <span x-text="effect.label"></span>
              <span x-show="effect.turns_remaining < 90" x-text="'(' + effect.turns_remaining + ')' "></span>
            </span>
          </template>
        </div>
        <div class="w-full h-2.5 bg-slate-950 rounded-full overflow-hidden border border-red-800/80 p-0.5">
          <div class="h-full rounded-full bg-gradient-to-r from-red-700 via-rose-600 to-red-500 transition-all duration-500"
               :style="'width: ' + Math.max(0, Math.min(100, (activeEnemy?.hp / activeEnemy?.max_hp) * 100)) + '%'"></div>
        </div>
        <details x-show="activeEnemy?.hp > 0" class="mt-2 text-[10px]">
          <summary class="cursor-pointer text-red-300 hover:text-red-200 font-fantasy select-none">
            ⚔ Mechanika starcia i elementy areny
          </summary>
          <div class="mt-2 grid grid-cols-1 md:grid-cols-4 gap-2">
            <div class="p-2 rounded-lg border border-amber-700/50 bg-amber-950/30">
              <div class="font-bold text-amber-300" x-text="(activeEnemy?.telegraph?.icon || '⚠️') + ' ' + (activeEnemy?.telegraph?.name || enemyProfile.next_attack_label || 'Nadchodzący atak')"></div>
              <div class="text-gray-300 mt-0.5" x-text="activeEnemy?.telegraph?.description"></div>
            </div>
            <template x-for="feature in activeEnemy?.features || []" :key="feature.id">
              <button type="button" @click="setEncounterAction(feature)"
                      :disabled="feature.state !== 'active' || hasSubmittedCurrentTurn || session?.is_turn_resolving"
                      class="text-left p-2 rounded-lg border transition disabled:opacity-40 disabled:cursor-not-allowed"
                      :class="feature.state === 'active' ? 'border-indigo-700/60 bg-indigo-950/30 hover:border-indigo-400' : 'border-slate-800 bg-slate-950/60'">
                <div class="font-bold text-indigo-200">
                  <span x-text="feature.icon"></span> <span x-text="feature.name"></span>
                </div>
                <div class="text-gray-300 mt-0.5" x-text="feature.description"></div>
                <div class="text-indigo-300 mt-1 font-mono"
                     x-text="feature.state === 'active' ? (statShortLabel(feature.required_stat) + ' • DC ' + feature.dc) : 'WYKORZYSTANO'"></div>
              </button>
            </template>
          </div>
        </details>
      </div>
    </header>
