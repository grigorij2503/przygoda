<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Edge Leyline Gradient: Mythic Gold transitioning to Electric Cyan/Violet -->
    <linearGradient id="d20EdgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Edge Highlight for Top Lighted Edges -->
    <linearGradient id="d20EdgeLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.7" />
    </linearGradient>

    <!-- Number 20 Fill Gradient -->
    <linearGradient id="d20NumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="28%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Facet Shading Gradients (Calculated from 3D Normal Lighting) -->
    <!-- 1. Center Face: Radiant Void Core -->
    <radialGradient id="d20FacetCenter" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a2436" />
      <stop offset="65%" stop-color="#181524" />
      <stop offset="100%" stop-color="#0f0d18" />
    </radialGradient>

    <!-- 2. Top-Left High-Light Facets -->
    <linearGradient id="d20FInnerTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c455c" />
      <stop offset="100%" stop-color="#242a3a" />
    </linearGradient>

    <linearGradient id="d20FOuterTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#464f69" />
      <stop offset="100%" stop-color="#2b3246" />
    </linearGradient>

    <linearGradient id="d20FOuterTopRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#343d52" />
      <stop offset="100%" stop-color="#1d2230" />
    </linearGradient>

    <linearGradient id="d20FInnerTopRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3447" />
      <stop offset="100%" stop-color="#181d28" />
    </linearGradient>

    <linearGradient id="d20FOuterLeft" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2d3548" />
      <stop offset="100%" stop-color="#181d2a" />
    </linearGradient>

    <!-- 3. Bottom & Shadow Facets -->
    <linearGradient id="d20FInnerBottom" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1d212f" />
      <stop offset="100%" stop-color="#10131e" />
    </linearGradient>

    <linearGradient id="d20FOuterBottomLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181c28" />
      <stop offset="100%" stop-color="#0e1017" />
    </linearGradient>

    <linearGradient id="d20FOuterRight" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#191d29" />
      <stop offset="100%" stop-color="#0c0e14" />
    </linearGradient>

    <linearGradient id="d20FOuterBottomRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#13151f" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="d20Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="d20SubtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Aura Behind D20 -->
  <circle cx="256" cy="256" r="140" fill="#f59e0b" opacity="0.12" filter="url(#d20SubtleGlow)" />
  <circle cx="256" cy="225" r="90" fill="#38bdf8" opacity="0.08" filter="url(#d20SubtleGlow)" />

  <!-- D20 Polyhedron (Exact Mathematical Orthogonal Projection) -->
  <g>
    <!-- 10 Facets -->
    <!-- 1. Central Face (Equilateral Triangle, pointing UP, centered at 256,256) -->
    <polygon points="256.0,147.8 162.3,310.1 349.7,310.1"
             fill="url(#d20FacetCenter)" />

    <!-- 2. Inner Ring Facets -->
    <!-- Inner Top-Left -->
    <polygon points="256.0,147.8 162.3,310.1 104.5,168.5"
             fill="url(#d20FInnerTopLeft)" />

    <!-- Inner Top-Right -->
    <polygon points="256.0,147.8 349.7,310.1 407.6,168.5"
             fill="url(#d20FInnerTopRight)" />

    <!-- Inner Bottom -->
    <polygon points="162.3,310.1 349.7,310.1 256.0,431.0"
             fill="url(#d20FInnerBottom)" />

    <!-- 3. Outer Rim Facets -->
    <!-- Outer Top-Left -->
    <polygon points="256.0,147.8 104.5,168.5 256.0,81.0"
             fill="url(#d20FOuterTopLeft)" />

    <!-- Outer Top-Right -->
    <polygon points="256.0,147.8 407.6,168.5 256.0,81.0"
             fill="url(#d20FOuterTopRight)" />

    <!-- Outer Left -->
    <polygon points="162.3,310.1 104.5,168.5 104.5,343.5"
             fill="url(#d20FOuterLeft)" />

    <!-- Outer Bottom-Left -->
    <polygon points="162.3,310.1 256.0,431.0 104.5,343.5"
             fill="url(#d20FOuterBottomLeft)" />

    <!-- Outer Right -->
    <polygon points="349.7,310.1 407.6,168.5 407.6,343.5"
             fill="url(#d20FOuterRight)" />

    <!-- Outer Bottom-Right -->
    <polygon points="349.7,310.1 256.0,431.0 407.6,343.5"
             fill="url(#d20FOuterBottomRight)" />

    <!-- Wireframe Edges (High Precision Bevel Lines) -->
    <g stroke="url(#d20EdgeGrad)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <!-- Outer Hexagon Silhouette -->
      <polygon points="256.0,81.0 407.6,168.5 407.6,343.5 256.0,431.0 104.5,343.5 104.5,168.5"
               stroke-width="4.5" />

      <!-- Inner Central Triangle (with crisp top-light gradient) -->
      <polygon points="256.0,147.8 162.3,310.1 349.7,310.1"
               stroke="url(#d20EdgeLight)" stroke-width="3.5" />

      <!-- Radial Interior Edges -->
      <line x1="256.0" y1="147.8" x2="256.0" y2="81.0" stroke="url(#d20EdgeLight)" stroke-width="3" />
      <line x1="256.0" y1="147.8" x2="104.5" y2="168.5" stroke="url(#d20EdgeLight)" stroke-width="3" />
      <line x1="256.0" y1="147.8" x2="407.6" y2="168.5" stroke="url(#d20EdgeLight)" stroke-width="3" />
      <line x1="162.3" y1="310.1" x2="104.5" y2="168.5" stroke-width="3" />
      <line x1="162.3" y1="310.1" x2="104.5" y2="343.5" stroke-width="3" />
      <line x1="162.3" y1="310.1" x2="256.0" y2="431.0" stroke-width="3" />
      <line x1="349.7" y1="310.1" x2="407.6" y2="168.5" stroke-width="3" />
      <line x1="349.7" y1="310.1" x2="407.6" y2="343.5" stroke-width="3" />
      <line x1="349.7" y1="310.1" x2="256.0" y2="431.0" stroke-width="3" />
    </g>

    <!-- Glowing Vertex Nodes -->
    <g fill="#ffffff" filter="url(#d20Glow)">
      <circle cx="256.0" cy="81.0" r="3.5" />
      <circle cx="407.6" cy="168.5" r="3" />
      <circle cx="407.6" cy="343.5" r="2.5" opacity="0.8" />
      <circle cx="256.0" cy="431.0" r="3" />
      <circle cx="104.5" cy="343.5" r="2.5" opacity="0.8" />
      <circle cx="104.5" cy="168.5" r="3" />

      <circle cx="256.0" cy="147.8" r="3.5" />
      <circle cx="162.3" cy="310.1" r="3" />
      <circle cx="349.7" cy="310.1" r="3" />
    </g>

    <!-- Center '20' - Bold, Modern Heroic Typography -->
    <text x="256" y="278"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Cinzel', Montserrat, sans-serif"
          font-size="76"
          font-weight="900"
          fill="#000000"
          fill-opacity="0.65"
          text-anchor="middle"
          dominant-baseline="central"
          letter-spacing="-1.5px"
          transform="translate(0, 3)">20</text>

    <text x="256" y="278"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Cinzel', Montserrat, sans-serif"
          font-size="76"
          font-weight="900"
          fill="url(#d20NumGrad)"
          text-anchor="middle"
          dominant-baseline="central"
          letter-spacing="-1.5px"
          filter="url(#d20Glow)">20</text>

    <!-- Critical Success Spark Pinpoint above 20 -->
    <path d="M 256,188 L 258.5,195.5 L 266,198 L 258.5,200.5 L 256,208 L 253.5,200.5 L 246,198 L 253.5,195.5 Z"
          fill="#ffffff" opacity="0.95" filter="url(#d20Glow)" />
  </g>
</svg>
