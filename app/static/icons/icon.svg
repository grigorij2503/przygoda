<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="60%" stop-color="#0e1118" />
      <stop offset="100%" stop-color="#06070a" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="facetGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="facetGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#292524" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="facetGradCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle / squircle base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="230" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" fill="none" />
  <circle cx="256" cy="256" r="220" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8,6" stroke-opacity="0.4" fill="none" />

  <!-- D20 Outer & Glow -->
  <g filter="url(#glow)">
    <!-- Outer Hexagon / D20 Silhouette -->
    <!-- Top vertex: (256, 75) -->
    <!-- Top-right vertex: (415, 165) -->
    <!-- Bottom-right vertex: (415, 345) -->
    <!-- Bottom vertex: (256, 435) -->
    <!-- Bottom-left vertex: (97, 345) -->
    <!-- Top-left vertex: (97, 165) -->

    <!-- Inner inverted triangle vertices: -->
    <!-- Top Center: (256, 175) -->
    <!-- Bottom Right: (355, 335) -->
    <!-- Bottom Left: (157, 335) -->

    <!-- Facets -->
    <!-- Central inverted triangle -->
    <polygon points="256,175 355,335 157,335" fill="url(#facetGradCenter)" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round" />

    <!-- Top facet -->
    <polygon points="256,75 97,165 256,175" fill="url(#facetGrad1)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />
    <polygon points="256,75 415,165 256,175" fill="url(#facetGrad2)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />

    <!-- Side facets -->
    <polygon points="97,165 97,345 157,335" fill="url(#facetGrad2)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />
    <polygon points="97,165 157,335 256,175" fill="url(#facetGrad1)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />

    <polygon points="415,165 415,345 355,335" fill="url(#facetGrad1)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />
    <polygon points="415,165 355,335 256,175" fill="url(#facetGrad2)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />

    <!-- Bottom facets -->
    <polygon points="97,345 256,435 157,335" fill="url(#facetGrad1)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />
    <polygon points="415,345 256,435 355,335" fill="url(#facetGrad2)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />
    <polygon points="157,335 355,335 256,435" fill="url(#facetGradCenter)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />

    <!-- Number '20' on center face -->
    <text x="256" y="285" font-family="'Cinzel Decorative', 'Cinzel', Georgia, serif" font-size="64" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">20</text>
    
    <!-- Little spark stars -->
    <circle cx="256" cy="115" r="3" fill="#fef08a" />
    <circle cx="380" cy="220" r="2.5" fill="#fef08a" />
    <circle cx="130" cy="220" r="2.5" fill="#fef08a" />
  </g>
</svg>